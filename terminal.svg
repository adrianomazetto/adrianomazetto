<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
    <!-- Background do Terminal -->
    <rect width="800" height="250" rx="10" ry="10" fill="#0d1117" stroke="#00FF88" stroke-width="2" stroke-opacity="0.3"/>
    
    <!-- Barra Superior -->
    <path d="M 0 10 Q 0 0 10 0 L 790 0 Q 800 0 800 10 L 800 30 L 0 30 Z" fill="#0b0f19"/>
    <!-- Botões estilo Mac -->
    <circle cx="20" cy="15" r="6" fill="#FF5F56"/>
    <circle cx="40" cy="15" r="6" fill="#FFBD2E"/>
    <circle cx="60" cy="15" r="6" fill="#27C93F"/>
    
    <!-- Título do Terminal -->
    <text x="400" y="20" font-family="sans-serif" font-size="12" fill="#8B949E" text-anchor="middle">adriano@mazetto: ~</text>

    <!-- Código Digitado -->
    <g font-family="monospace" font-size="16" fill="#E6EDF3">
        
        <!-- Linha 1 -->
        <text x="20" y="70" opacity="0">
            <tspan fill="#00FF88">adriano@mazetto</tspan><tspan fill="#00F0FF">:</tspan><tspan fill="#00FF88">~</tspan>$ npx boot-profile --role="Full Stack"
            <animate attributeName="opacity" values="0;1;1" keyTimes="0;0.1;1" dur="12s" repeatCount="indefinite" />
        </text>
        
        <!-- Linha 2 -->
        <text x="20" y="100" opacity="0">
            [<tspan fill="#00FF88">✓</tspan>] Carregando habilidades Maker e Design Thinking...
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2;0.25;1" dur="12s" repeatCount="indefinite" />
        </text>

        <!-- Linha 3 -->
        <text x="20" y="130" opacity="0">
            [<tspan fill="#00FF88">✓</tspan>] Montando Stack: <tspan fill="#F7DF1E">JavaScript</tspan>, <tspan fill="#61DAFB">React</tspan>, <tspan fill="#3178C6">TypeScript</tspan>, <tspan fill="#3FCF8E">Supabase</tspan>
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4;0.45;1" dur="12s" repeatCount="indefinite" />
        </text>
        
        <!-- Linha 4 -->
        <text x="20" y="160" opacity="0">
            [<tspan fill="#00FF88">✓</tspan>] Conectando à rede de Instrutores SENAI... <tspan fill="#27C93F">ONLINE</tspan>
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6;0.65;1" dur="12s" repeatCount="indefinite" />
        </text>

        <!-- Linha 5 -->
        <text x="20" y="190" opacity="0">
            <tspan fill="#00FF88">>> Success!</tspan> Projeto FazBico está em produção.
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.8;0.85;1" dur="12s" repeatCount="indefinite" />
        </text>

        <!-- Prompt Final e Cursor Piscando -->
        <text x="20" y="220" opacity="0">
            <tspan fill="#00FF88">adriano@mazetto</tspan><tspan fill="#00F0FF">:</tspan><tspan fill="#00FF88">~</tspan>$ 
            <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.9;0.92;1" dur="12s" repeatCount="indefinite" />
            <tspan font-weight="bold" fill="#00FF88">_
               <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite" />
            </tspan>
        </text>

    </g>
</svg>
