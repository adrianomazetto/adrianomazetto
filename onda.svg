<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="150" viewBox="0 0 1000 150" preserveAspectRatio="none">
    <!-- Wave 1 (Trás) -->
    <path fill="#00FF88" opacity="0.4" d="M 0 100 Q 125 70, 250 100 T 500 100 T 750 100 T 1000 100 T 1250 100 T 1500 100 T 1750 100 T 2000 100 L 2000 150 L 0 150 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Wave 2 (Frente) -->
    <path fill="#00FF88" opacity="0.8" d="M 0 110 Q 125 140, 250 110 T 500 110 T 750 110 T 1000 110 T 1250 110 T 1500 110 T 1750 110 T 2000 110 L 2000 150 L 0 150 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="6s" repeatCount="indefinite" />
    </path>
</svg>
